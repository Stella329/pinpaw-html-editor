  <circle cx="186" cy="60" r="20" fill="#e58aa0" stroke="#141414" stroke-width="3"/>
  <text x="186" y="67" text-anchor="middle" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="800" fill="#141414">1</text>
</svg>
