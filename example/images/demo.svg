<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">
  <!-- A 10-second loop in the example's flat style: pin a comment on an element → Export JSON → your agent (the cat) reads it → the slide is remade. Pure CSS, no script. -->
  <style>
    .t { font-size: 13px; font-weight: 600; fill: #fffdf6; }
    .mono { font-family: ui-monospace, Menlo, 'SF Mono', monospace; font-size: 11px; fill: #2a160e; }
    .key { fill: #a86a2d; }
    .lbl { font-size: 15px; font-weight: 800; fill: #141414; }
    .cursor { animation: cursor 10s infinite; }
    @keyframes cursor {
      0% { transform: translate(40px, 330px); opacity: 0 } 4% { opacity: 1 } 16% { transform: translate(150px, 232px) } 22% { transform: translate(150px, 232px); opacity: 1 } 26% { opacity: 0 } 100% { opacity: 0 } }
    .target { animation: target 10s infinite; stroke-dasharray: 7 5; }
    @keyframes target { 0%, 15% { opacity: 0 } 17%, 70% { opacity: 1 } 74%, 100% { opacity: 0 } }
    .pin { animation: pin 10s infinite; transform-origin: 206px 190px; }
    @keyframes pin { 0%, 19% { opacity: 0; transform: scale(0) } 22% { opacity: 1; transform: scale(1.25) } 24%, 70% { transform: scale(1); opacity: 1 } 74%, 100% { opacity: 0 } }
    .bubble { animation: bubble 10s infinite; }
    @keyframes bubble { 0%, 22% { opacity: 0 } 25%, 48% { opacity: 1 } 52%, 100% { opacity: 0 } }
    .typed { animation: typed 10s infinite; }
    @keyframes typed { 0%, 25% { width: 190px } 40%, 100% { width: 0 } }
    .json { animation: json 10s infinite; transform-origin: 538px 180px; }
    @keyframes json { 0%, 40% { opacity: 0; transform: translate(-40px, 0) } 46%, 58% { opacity: 1; transform: translate(0, 0) } 70% { opacity: 0; transform: translate(260px, 0) scale(.3) } 100% { opacity: 0 } }
    .exportlbl { animation: exportlbl 10s infinite; }
    @keyframes exportlbl { 0%, 42% { opacity: 0 } 46%, 60% { opacity: 1 } 64%, 100% { opacity: 0 } }
    .agent { animation: agent 10s infinite; transform-origin: 790px 210px; }
    @keyframes agent { 0%, 60% { transform: scale(1) } 66% { transform: scale(1.08) } 72% { transform: scale(1) } 80% { transform: scale(1.05) } 88%, 100% { transform: scale(1) } }
    .pupils { animation: pupils 10s infinite; }
    @keyframes pupils { 0%, 44% { transform: translate(0, 0) } 48%, 70% { transform: translate(-7px, 2px) } 76%, 100% { transform: translate(0, 0) } }
    .spark { animation: spark 10s infinite; transform-origin: 846px 150px; }
    @keyframes spark { 0%, 64% { opacity: 0; transform: rotate(0deg) scale(.3) } 70%, 86% { opacity: 1; transform: rotate(40deg) scale(1) } 92%, 100% { opacity: 0 } }
    .beam { animation: beam 10s infinite; stroke-dasharray: 9 8; }
    @keyframes beam { 0%, 72% { opacity: 0 } 74%, 84% { opacity: 1; stroke-dashoffset: 0 } 86%, 100% { opacity: 0; stroke-dashoffset: -68px } }
    .oldimg { animation: oldimg 10s infinite; }
    @keyframes oldimg { 0%, 76% { opacity: 1 } 80%, 100% { opacity: 0 } }
    .bar { animation: bar 10s infinite; transform-origin: 50% 100%; transform-box: fill-box; }
    @keyframes bar { 0%, 78% { transform: scaleY(0) } 86%, 96% { transform: scaleY(1) } 100% { transform: scaleY(0) } }
    .b2 { animation-delay: .15s } .b3 { animation-delay: .3s } .b4 { animation-delay: .45s }
    .done { animation: done 10s infinite; transform-origin: 300px 150px; }
    @keyframes done { 0%, 84% { opacity: 0; transform: scale(.5) } 88% { opacity: 1; transform: scale(1.2) } 90%, 96% { opacity: 1; transform: scale(1) } 100% { opacity: 0 } }
    .step { animation: step 10s infinite; }
    @keyframes step { 0% { opacity: 0 } 3%, 97% { opacity: 1 } 100% { opacity: 0 } }
    .s1 { animation: s1 10s infinite } .s2 { animation: s2 10s infinite } .s3 { animation: s3 10s infinite }
    @keyframes s1 { 0%, 14% { fill: #6f9a79 } 17%, 42% { fill: #f2b531 } 46%, 100% { fill: #6f9a79 } }
    @keyframes s2 { 0%, 42% { fill: #6f9a79 } 46%, 66% { fill: #f2b531 } 70%, 100% { fill: #6f9a79 } }
    @keyframes s3 { 0%, 66% { fill: #6f9a79 } 70%, 96% { fill: #f2b531 } 100% { fill: #6f9a79 } }
  </style>
  <rect width="960" height="400" fill="#a9bc98"/>
  <rect y="336" width="960" height="64" fill="#3f7a52"/>

  <!-- the three steps, on the table -->
  <g class="step">
    <circle class="s1" cx="150" cy="368" r="6"/><text x="166" y="373" class="t">1 · pin a comment on the element</text>
    <circle class="s2" cx="430" cy="368" r="6"/><text x="446" y="373" class="t">2 · Export JSON</text>
    <circle class="s3" cx="640" cy="368" r="6"/><text x="656" y="373" class="t">3 · your agent remakes the slide</text>
  </g>

  <!-- the mini slide -->
  <g>
    <rect x="60" y="80" width="300" height="200" rx="14" fill="#fffdf6" stroke="#141414" stroke-width="3"/>
    <rect x="80" y="100" width="150" height="12" rx="6" fill="#141414"/>
    <rect x="80" y="124" width="220" height="8" rx="4" fill="#c9c2ad"/>
    <rect x="80" y="140" width="190" height="8" rx="4" fill="#c9c2ad"/>
    <rect x="80" y="156" width="205" height="8" rx="4" fill="#c9c2ad"/>
    <!-- the image placeholder that gets commented on -->
    <g class="oldimg">
      <rect x="86" y="184" width="120" height="78" rx="8" fill="#e8e1cc"/>
      <path d="M100 248 L128 214 L150 238 L166 224 L192 248 Z" fill="#b7ad90"/>
      <circle cx="176" cy="204" r="8" fill="#f2b531"/>
    </g>
    <!-- the new chart the agent makes: coffee layers -->
    <g>
      <rect class="bar"    x="98"  y="214" width="18" height="48" rx="3" fill="#2a160e"/>
      <rect class="bar b2" x="124" y="200" width="18" height="62" rx="3" fill="#a86a2d"/>
      <rect class="bar b3" x="150" y="190" width="18" height="72" rx="3" fill="#141414"/>
      <rect class="bar b4" x="176" y="222" width="18" height="40" rx="3" fill="#3f7a52"/>
    </g>
    <rect class="target" x="82" y="180" width="128" height="86" rx="10" fill="none" stroke="#e58aa0" stroke-width="3"/>
    <!-- comment pin and bubble -->
    <g class="pin"><circle cx="206" cy="190" r="13" fill="#e58aa0" stroke="#141414" stroke-width="2.5"/><text x="206" y="195" text-anchor="middle" font-size="13" font-weight="800" fill="#141414">1</text></g>
    <g class="bubble" transform="translate(0 -34)">
      <path d="M216 150 h210 a9 9 0 0 1 9 9 v34 a9 9 0 0 1 -9 9 h-184 l-12 12 v-12 h-14 a9 9 0 0 1 -9 -9 v-34 a9 9 0 0 1 9 -9 z" fill="#fffdf6" stroke="#141414" stroke-width="3"/>
      <svg x="228" y="162" height="26"><text x="0" y="18" font-size="13" font-weight="600" fill="#141414">replace with the Q3 chart</text><rect class="typed" x="0" y="0" height="26" fill="#fffdf6" transform="translate(190 0) scale(-1 1)"/></svg>
    </g>
    <g class="done"><circle cx="300" cy="150" r="17" fill="#3f7a52" stroke="#141414" stroke-width="2.5"/><path d="M291 150 l6 6 l12 -13" fill="none" stroke="#fffdf6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>

  <!-- the cursor -->
  <g class="cursor"><path d="M0 0 L0 22 L6 17 L10 26 L14 24 L10 15 L17 15 Z" fill="#141414" stroke="#fffdf6" stroke-width="1.5" stroke-linejoin="round"/></g>

  <!-- the JSON card -->
  <g class="json">
    <rect x="420" y="96" width="236" height="168" rx="14" fill="#fffdf6" stroke="#141414" stroke-width="3"/>
    <text x="438" y="120" class="mono">{</text>
    <text x="450" y="140" class="mono"><tspan class="key">"type"</tspan>: "comment",</text>
    <text x="450" y="158" class="mono"><tspan class="key">"path"</tspan>: "body &gt; section:nth-of-type(2)</text>
    <text x="464" y="174" class="mono">&gt; div.card &gt; img",</text>
    <text x="450" y="194" class="mono"><tspan class="key">"what"</tspan>: "chart.svg",</text>
    <text x="450" y="212" class="mono"><tspan class="key">"text"</tspan>: "replace with the Q3 chart"</text>
    <text x="438" y="238" class="mono">}</text>
  </g>
  <text class="exportlbl lbl" x="420" y="78">📤 Export JSON → deck.review.json</text>

  <!-- the agent: the cat -->
  <line class="beam" x1="716" y1="200" x2="372" y2="200" stroke="#141414" stroke-width="3"/>
  <g class="agent">
    <ellipse cx="790" cy="300" rx="62" ry="40" fill="#141414"/>
    <path d="M736 150 L756 212 L824 212 L844 150 L824 180 Q790 162 756 180 Z" fill="#141414"/>
    <ellipse cx="790" cy="226" rx="66" ry="58" fill="#141414"/>
    <ellipse cx="765" cy="218" rx="16" ry="18" fill="#f2b531"/>
    <ellipse cx="815" cy="218" rx="16" ry="18" fill="#f2b531"/>
    <g class="pupils">
      <ellipse cx="767" cy="220" rx="6" ry="12" fill="#141414"/>
      <ellipse cx="813" cy="220" rx="6" ry="12" fill="#141414"/>
      <circle cx="771" cy="212" r="2.5" fill="#fff"/><circle cx="817" cy="212" r="2.5" fill="#fff"/>
    </g>
    <g stroke="#141414" stroke-width="2.5" stroke-linecap="round">
      <path d="M724 244 L690 238"/><path d="M726 256 L692 262"/><path d="M856 244 L890 238"/><path d="M854 256 L888 262"/>
    </g>
    <ellipse cx="790" cy="264" rx="7" ry="9" fill="#e58aa0"/>
    <path class="spark" d="M846 128 l5 15 l15 5 l-15 5 l-5 15 l-5 -15 l-15 -5 l15 -5 z" fill="#f2b531" stroke="#141414" stroke-width="2"/>
  </g>
  <text x="790" y="110" text-anchor="middle" class="lbl">your agent</text>
  <text x="790" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#2a4a33">reads the path, edits the source</text>
</svg>
